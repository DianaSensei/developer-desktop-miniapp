name: Release plugins

# Tag push (v*) builds every plugin bundle (kind="plugin") and every sidecar
# binary (kind="service") for the target triples below, computes SHA-256 for
# each artifact, fills the manifest templates with real URLs/integrity, and
# publishes everything — bundles, binaries, manifests, and one aggregated
# catalog.json — as assets on a single GitHub Release. developer-desktop-utils's
# Settings → Extensions installs directly from a manifest URL here (see
# docs/plugin-sdk/05-external-install.md in that repo); the site reads
# catalog.json to render the installable-plugins list.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-plugins:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Build every plugin bundle
        run: npm run build

      - name: Upload bundle artifacts for the sidecar job to attach manifests to
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-bundles
          path: |
            plugins/*/dist/bundle.mjs

  build-sidecars:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            plugins/redis-client/sidecar -> target
            plugins/rabbit-client/sidecar -> target
            plugins/container-manager/sidecar -> target

      - name: Build every sidecar
        shell: bash
        run: |
          set -euo pipefail
          for dir in plugins/redis-client/sidecar plugins/rabbit-client/sidecar plugins/container-manager/sidecar; do
            (cd "$dir" && cargo build --release --target ${{ matrix.rust-target }})
          done

      - name: Collect binaries (rename with target triple, add .exe on Windows)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          for bin in devtool-svc-redis devtool-svc-rabbit devtool-svc-container; do
            case "$bin" in
              devtool-svc-redis) dir=plugins/redis-client/sidecar ;;
              devtool-svc-rabbit) dir=plugins/rabbit-client/sidecar ;;
              devtool-svc-container) dir=plugins/container-manager/sidecar ;;
            esac
            cp "$dir/target/${{ matrix.rust-target }}/release/${bin}${EXT}" \
               "out/${bin}-${{ matrix.rust-target }}${EXT}"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidecars-${{ matrix.rust-target }}
          path: out/*

  publish:
    needs: [build-plugins, build-sidecars]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0
        with:
          pattern: 'plugin-bundles'
          path: downloaded/bundles
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0
        with:
          pattern: 'sidecars-*'
          path: downloaded/sidecars
          merge-multiple: true

      - name: Build manifests + catalog.json and stage release assets
        run: node scripts/build-release.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Plugins ${GITHUB_REF_NAME}" \
            --notes "Automated build of every plugin/sidecar in this repo. See catalog.json for the full list." \
            release-assets/*
