name: Release plugins

# Tag push (v*) builds every plugin bundle (kind="plugin") and every sidecar
# binary (kind="service") for the target triples below, computes SHA-256 for
# each artifact, fills the manifest templates with real URLs/integrity, and
# publishes everything — bundles, binaries, manifests, and one aggregated
# catalog.json — as assets on a single GitHub Release. developer-desktop-utils's
# Settings → Extensions installs directly from a manifest URL here (see
# docs/plugin-sdk/05-external-install.md in that repo); the site reads
# catalog.json to render the installable-plugins list.
#
# Also runnable manually (workflow_dispatch) for environments that can drive
# the GitHub Actions API but can't push a tag ref (e.g. a scoped CI bot
# token). `gh release create` below creates the tag itself, pointed at
# whatever ref the manual run used, if it doesn't already exist.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-plugins:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint:manifests
      - run: npm run typecheck
      - run: npm test

      - name: Build every plugin bundle
        run: npm run build

      - name: Upload bundle artifacts for the sidecar job to attach manifests to
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-bundles
          path: |
            plugins/*/dist/bundle.mjs

  build-sidecars:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            plugins/redis-client/sidecar -> target
            plugins/rabbit-client/sidecar -> target
            plugins/container-manager/sidecar -> target
            plugins/kafka-explorer/sidecar -> target

      # Discovers sidecars dynamically (any plugins/*/sidecar with a
      # Cargo.toml) so adding a new plugin here never requires touching this
      # workflow — the bin name comes from `[[bin]] name` in each crate's own
      # Cargo.toml, which is also what `manifest.service.json`'s `bin` field
      # must match (checked by `npm run lint:manifests`).
      - name: Build every sidecar
        shell: bash
        run: |
          set -euo pipefail
          for dir in plugins/*/sidecar; do
            [ -f "$dir/Cargo.toml" ] || continue
            echo "== $dir =="
            (cd "$dir" && cargo build --release --target ${{ matrix.rust-target }})
          done

      - name: Collect binaries (rename with target triple, add .exe on Windows)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          for dir in plugins/*/sidecar; do
            [ -f "$dir/Cargo.toml" ] || continue
            bin=$(grep -m1 '^name = ' "$dir/Cargo.toml" | sed -E 's/name = "(.*)"/\1/')
            cp "$dir/target/${{ matrix.rust-target }}/release/${bin}${EXT}" \
               "out/${bin}-${{ matrix.rust-target }}${EXT}"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidecars-${{ matrix.rust-target }}
          path: out/*

  publish:
    needs: [build-plugins, build-sidecars]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
        with:
          pattern: 'plugin-bundles'
          path: downloaded/bundles
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
        with:
          pattern: 'sidecars-*'
          path: downloaded/sidecars
          merge-multiple: true

      - name: Resolve release tag (workflow_dispatch input, or the pushed tag)
        run: echo "RELEASE_TAG=${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Build manifests + catalog.json and stage release assets
        run: node scripts/build-release.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Plugins ${RELEASE_TAG}" \
            --notes "Automated build of every plugin/sidecar in this repo. See catalog.json for the full list." \
            --target "${{ github.sha }}" \
            release-assets/*

      # Release assets are served from a storage host that never sends
      # Access-Control-Allow-Origin, so a browser fetch() of catalog.json
      # (starlight-site's /plugins page) fails CORS silently — the page's
      # error handler then leaves every button in its disabled "loading"
      # state forever. raw.githubusercontent.com does send that header, so
      # also commit catalog.json straight into the repo and have the site
      # read it from there instead of from the release asset.
      - name: Commit catalog.json to the repo (raw.githubusercontent.com serves it with CORS)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp release-assets/catalog.json catalog.json
          git add catalog.json
          git diff --cached --quiet && exit 0
          git commit -m "Update catalog.json for ${RELEASE_TAG}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
