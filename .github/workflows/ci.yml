name: CI

# Fast feedback on every push/PR — catches a broken plugin bundle or sidecar
# before anyone pushes a release tag. release.yml (tag push) does the real
# cross-platform sidecar build/publish; this just proves things build and
# pass on Linux, quickly.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint:manifests
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sidecars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            plugins/redis-client/sidecar -> target
            plugins/rabbit-client/sidecar -> target
            plugins/container-manager/sidecar -> target
            plugins/kafka-explorer/sidecar -> target

      - name: Build every sidecar (native target, debug — full cross-compile matrix is release.yml's job)
        shell: bash
        run: |
          set -euo pipefail
          for dir in plugins/*/sidecar; do
            [ -f "$dir/Cargo.toml" ] || continue
            echo "== $dir =="
            (cd "$dir" && cargo build)
          done

      - name: Run sidecar unit tests (non-#[ignore]'d only — no live broker/daemon in CI)
        shell: bash
        run: |
          set -euo pipefail
          for dir in plugins/*/sidecar; do
            [ -f "$dir/Cargo.toml" ] || continue
            echo "== $dir =="
            (cd "$dir" && cargo test)
          done
