name: CI

# main is the SKELETON only — shared/ (vendored UI kit + lib utilities) and
# scripts/ that every app/<id>/main plugin branch builds on top of. No
# plugins/ directory lives here, so there's nothing to bundle or
# cross-compile: just typecheck + test the shared code itself. Each plugin's
# own build/typecheck/test/sidecar CI lives on its own app/<id>/main branch's
# ci.yml — see README.md for the branch layout.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
