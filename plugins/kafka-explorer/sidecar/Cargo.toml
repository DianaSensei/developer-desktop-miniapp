[package]
name = "devtool-svc-kafka"
version = "0.1.0"
edition = "2021"
publish = false
description = "DevTool Tier-B sidecar for the Kafka Explorer plugin — JSONL over stdio, see docs/plugin-sdk/04-tier-b-sidecars.md in developer-desktop-utils."

[[bin]]
name = "devtool-svc-kafka"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.23"
rskafka = { version = "0.6", features = ["transport-tls"] }

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
panic = "abort"
