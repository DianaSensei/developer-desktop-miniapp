[package]
name = "devtool-svc-redis"
version = "0.1.0"
edition = "2021"
publish = false
description = "DevTool Tier-B sidecar for the Redis plugin — JSONL over stdio, see docs/plugin-sdk/04-tier-b-sidecars.md in developer-desktop-utils."

[[bin]]
name = "devtool-svc-redis"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
percent-encoding = "2"
redis = { version = "1.6.0", features = ["tokio-comp", "tls-rustls", "tokio-rustls-comp"] }

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
panic = "abort"
