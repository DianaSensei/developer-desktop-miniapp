[package]
name = "devtool-svc-rabbit"
version = "0.1.0"
edition = "2021"
publish = false
description = "DevTool Tier-B sidecar for the RabbitMQ plugin — JSONL over stdio, see docs/plugin-sdk/04-tier-b-sidecars.md in developer-desktop-utils."

[[bin]]
name = "devtool-svc-rabbit"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
percent-encoding = "2"
base64 = "0.23"
# lapin 4 bundles its own async runtime (default-runtime = tokio) — see the
# same note in developer-desktop-utils's src-tauri/Cargo.toml history for why
# that matters on Windows. Default features (rustls + tokio) cover TLS + tokio.
lapin = "4"

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
panic = "abort"
